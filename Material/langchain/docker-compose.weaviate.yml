# Local Weaviate for the hybrid-search lab (anonymous access, persisted volume).
# Start:  docker compose -f docker-compose.weaviate.yml up -d
# Stop:   docker compose -f docker-compose.weaviate.yml down
# Ready:  http://localhost:8080/v1/.well-known/ready

services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    # Docker Hub image (cr.weaviate.io sometimes fails to pull behind flaky networks)
    image: semitechnologies/weaviate:1.27.0
    ports:
      - 8080:8080
      - 50051:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
      # No built-in vectorizer module: LangChain/OpenAI supplies embeddings.

volumes:
  weaviate_data:
